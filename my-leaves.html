<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Applications · AA HR Group</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/app.js"></script>
</head>
<body>
  <div id="page" hidden>
    <div class="page-head">
      <div>
        <h1>My Applications</h1>
        <p>All the leave you have applied for.</p>
      </div>
      <a href="apply.html" class="btn btn-primary">+ Apply Leave</a>
    </div>

    <div class="card">
      <div class="card-head">
        <div class="tabs" id="tabs">
          <button class="tab active" data-status="">All</button>
          <button class="tab" data-status="pending">Pending</button>
          <button class="tab" data-status="approved">Approved</button>
          <button class="tab" data-status="rejected">Rejected</button>
          <button class="tab" data-status="cancelled">Cancelled</button>
        </div>
        <div class="filters"><select id="year"></select></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Ref</th><th>Type</th><th>Dates</th><th>Days</th><th>Applied on</th><th>Status</th><th>Director remarks</th><th></th></tr></thead>
          <tbody id="rows"><tr><td colspan="8" class="empty">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    (async () => {
      const { sb, esc, fmtDays, fmtDate, statusBadge, refNo, dateRange, toast, errMsg } = AAHR;
      const me = await AAHR.init({ active: 'my-leaves' });
      const yearSel = document.getElementById('year');
      const thisYear = new Date().getFullYear();
      for (let y = thisYear + 1; y >= thisYear - 4; y--) yearSel.add(new Option(y, y, false, y === thisYear));
      let status = '';
      let rows = [];

      async function load() {
        const y = +yearSel.value;
        let q = sb.from('leave_applications').select('*, leave_types(name, color)')
          .eq('user_id', me.id).gte('start_date', `${y}-01-01`).lte('start_date', `${y}-12-31`)
          .order('start_date', { ascending: false });
        if (status) q = q.eq('status', status);
        const { data, error } = await q;
        if (error) return toast(errMsg(error), 'error');
        rows = data;
        document.getElementById('rows').innerHTML = rows.length ? rows.map((a, i) => `<tr>
            <td class="nowrap"><strong>${refNo(a)}</strong></td>
            <td><span class="type-dot" style="background:${esc(a.leave_types.color)}"></span>${esc(a.leave_types.name)}</td>
            <td class="nowrap">${dateRange(a)}</td>
            <td>${fmtDays(a.days)}</td>
            <td class="nowrap">${fmtDate(a.created_at)}</td>
            <td>${statusBadge(a.status)}</td>
            <td class="muted">${esc(a.director_remarks || '')}</td>
            <td><div class="actions">
              <a href="view.html?id=${a.id}" class="btn btn-light btn-sm">View</a>
              ${a.status === 'pending' ? `<button class="btn btn-light btn-sm" data-cancel="${i}" style="color:var(--danger)">Cancel</button>` : ''}
            </div></td></tr>`).join('')
          : '<tr><td colspan="8" class="empty">No applications found.</td></tr>';
      }

      document.getElementById('rows').addEventListener('click', (e) => {
        const b = e.target.closest('[data-cancel]');
        if (b) AAHR.cancelLeave(rows[+b.dataset.cancel], load);
      });
      document.getElementById('tabs').addEventListener('click', (e) => {
        const t = e.target.closest('.tab');
        if (!t) return;
        document.querySelectorAll('#tabs .tab').forEach((x) => x.classList.toggle('active', x === t));
        status = t.dataset.status;
        load();
      });
      yearSel.onchange = load;
      load();
    })();
  </script>
</body>
</html>
