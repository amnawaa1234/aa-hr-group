<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leave Application · AA HR Group</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/app.js"></script>
</head>
<body>
  <div id="page" hidden>
    <div class="page-head no-print" style="max-width:820px;margin-left:auto;margin-right:auto">
      <a href="javascript:history.back()" class="btn btn-light btn-sm">← Back</a>
      <div class="actions" id="actions"></div>
    </div>
    <div id="sheet" class="form-sheet"><div class="empty">Loading…</div></div>
  </div>

  <script>
    (async () => {
      const { sb, esc, fmtDays, fmtDate, fmtDateTime, refNo, toast, errMsg } = AAHR;
      const me = await AAHR.init({ active: 'my-leaves' });
      const id = +new URLSearchParams(location.search).get('id');

      async function load() {
        const { data: a, error } = await sb.from('leave_applications')
          .select('*, leave_types(*), profiles!leave_applications_user_id_fkey(full_name, staff_no, department, position, email, phone)')
          .eq('id', id).maybeSingle();
        if (error || !a) {
          document.getElementById('sheet').innerHTML = '<div class="empty">Application not found or you do not have access.</div>';
          return;
        }
        if (a.user_id !== me.id) {
          document.querySelectorAll('.nav-link.active').forEach((n) => n.classList.remove('active'));
          document.querySelector(`[data-nav="${me.role === 'director' && a.status === 'pending' ? 'approvals' : 'all-leaves'}"]`)?.classList.add('active');
        }

        const [{ data: types }, { data: approver }, { data: bal }] = await Promise.all([
          sb.from('leave_types').select('id, name').order('sort_order'),
          a.decided_by ? sb.from('profiles').select('full_name, position').eq('id', a.decided_by).maybeSingle() : Promise.resolve({ data: null }),
          sb.rpc('leave_balances', { p_user: a.user_id, p_year: +a.start_date.slice(0, 4) }),
        ]);
        const b = (bal || []).find((x) => x.leave_type_id === a.leave_type_id);
        const p = a.profiles;
        const statusText = { pending: 'PENDING', approved: 'APPROVED', rejected: 'REJECTED', cancelled: 'CANCELLED' }[a.status];

        document.getElementById('sheet').innerHTML = `
          <div class="sheet-head">
            <span class="brand-mark">AA</span>
            <div style="flex:1">
              <h1>Ascend Advisory (AA) Group</h1>
              <p>HR &amp; Admin Department · Leave Application Form</p>
            </div>
            <span class="stamp ${a.status}">${statusText}</span>
          </div>
          <div class="sheet-meta">
            <span>Ref No: <strong>${refNo(a)}</strong></span>
            <span>Submitted: <strong>${fmtDateTime(a.created_at)}</strong></span>
          </div>

          <div class="sheet-section">
            <h3>A. Applicant details</h3>
            <div class="sheet-grid">
              <div><small>Name</small>${esc(p.full_name)}</div>
              <div><small>Staff No.</small>${esc(p.staff_no || '-')}</div>
              <div><small>Position</small>${esc(p.position || '-')}</div>
              <div><small>Department</small>${esc(p.department || '-')}</div>
              <div><small>Email</small>${esc(AAHR.realEmail(p.email) || '-')}</div>
              <div><small>Contact during leave</small>${esc(a.contact_during_leave || p.phone || '-')}</div>
            </div>
          </div>

          <div class="sheet-section">
            <h3>B. Type of leave</h3>
            <div class="type-checks">
              ${types.map((t) => `<span><i>${t.id === a.leave_type_id ? '✓' : ''}</i>${esc(t.name)}</span>`).join('')}
            </div>
          </div>

          <div class="sheet-section">
            <h3>C. Leave details</h3>
            <div class="sheet-grid">
              <div><small>From</small>${fmtDate(a.start_date)}${a.half_day ? ` (${a.half_day} half day)` : ''}</div>
              <div><small>To</small>${fmtDate(a.end_date)}</div>
              <div><small>Number of days</small><strong>${fmtDays(a.days)}</strong> ${a.leave_types.calendar_days ? 'calendar' : 'working'} day(s)</div>
              <div><small>Work handed over to</small>${esc(a.handover_to || '-')}</div>
              <div class="full"><small>Reason</small>${esc(a.reason)}</div>
              <div class="full"><small>Supporting document</small>${a.attachment_path
                ? `<a href="#" id="attachLink">📎 ${esc(a.attachment_path.split('/').pop().replace(/^\d+_/, ''))}</a>` : 'None'}</div>
              ${b && b.entitled !== null ? `<div class="full"><small>${esc(a.leave_types.name)} balance (${a.start_date.slice(0, 4)})</small>
                Entitled ${fmtDays(b.entitled)} · Taken ${fmtDays(b.used)} · Pending ${fmtDays(b.pending)} · Balance ${fmtDays(b.balance)}</div>` : ''}
            </div>
          </div>

          <div class="sheet-section">
            <h3>D. Director's approval</h3>
            <div class="sheet-grid" style="margin-bottom:28px">
              <div><small>Decision</small><strong>${a.status === 'pending' ? 'Awaiting decision' : statusText}</strong></div>
              <div><small>Date</small>${a.decided_at ? fmtDateTime(a.decided_at) : '-'}</div>
              <div class="full"><small>Remarks</small>${esc(a.director_remarks || '-')}</div>
            </div>
            <div class="sign-row">
              <div class="sign-box"><strong>${esc(p.full_name)}</strong>Applicant · ${fmtDate(a.created_at)}</div>
              <div class="sign-box"><strong>${esc(approver?.full_name || '')}&nbsp;</strong>Director${a.decided_at ? ' · ' + fmtDate(a.decided_at) : ''}</div>
            </div>
          </div>
          <p class="muted" style="font-size:11.5px;text-align:center;margin:28px 0 0">This form was generated electronically by AA HR Group and does not require a signature.</p>`;

        const link = document.getElementById('attachLink');
        if (link) link.onclick = async (e) => {
          e.preventDefault();
          const url = await AAHR.attachmentUrl(a.attachment_path);
          if (url) window.open(url, '_blank', 'noopener');
        };

        const acts = [];
        if (me.role === 'director' && a.status === 'pending' && a.user_id !== me.id) {
          acts.push('<button class="btn btn-success btn-sm" data-act="approved">Approve</button>',
                    '<button class="btn btn-danger btn-sm" data-act="rejected">Reject</button>');
        }
        if (a.user_id === me.id && a.status === 'pending') {
          acts.push('<button class="btn btn-light btn-sm" data-act="cancel" style="color:var(--danger)">Cancel application</button>');
        }
        acts.push('<button class="btn btn-light btn-sm" data-act="print">🖨 Print / PDF</button>');
        const box = document.getElementById('actions');
        box.innerHTML = acts.join('');
        box.onclick = (e) => {
          const act = e.target.closest('[data-act]')?.dataset.act;
          if (act === 'print') window.print();
          else if (act === 'cancel') AAHR.cancelLeave(a, load);
          else if (act) AAHR.decide(a, act, load);
        };
      }
      load();
    })();
  </script>
</body>
</html>
